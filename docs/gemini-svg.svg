<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF99;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008855;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#080808" rx="16"/>
  
  <g transform="translate(40, 25)">
    <polygon points="50,5 95,30 95,80 50,105 5,80 5,30" fill="none" stroke="url(#grad1)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
    
    <circle cx="50" cy="55" r="18" fill="none" stroke="url(#grad2)" stroke-width="4"/>
    
    <path d="M 50 15 L 50 95" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 20 55 L 80 55" stroke="url(#grad2)" stroke-width="2" stroke-linecap="round"/>
    
    <circle cx="50" cy="5" r="5" fill="#00FF99" filter="url(#glow)"/>
    <circle cx="95" cy="80" r="3" fill="#FFFFFF"/>
    <circle cx="5" cy="80" r="3" fill="#FFFFFF"/>
  </g>

  <text x="160" y="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="2">Agent</text>
  <text x="325" y="80" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="52" font-weight="300" fill="url(#grad1)" letter-spacing="1">Pay</text>
  
  <text x="165" y="115" font-family="'Fira Code', 'Courier New', monospace" font-size="12" font-weight="600" fill="#555555" letter-spacing="5">ERC-8004 × X-402 PROTOCOL</text>
</svg>
